<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f4a28">
<title>Pesaje de Aves</title>
<style>
:root{
  --bg:#f3eedf; --ink:#22301f; --mut:#6b705f; --g:#2f6b3a; --gd:#1f4a28; --gl:#e1eedd;
  --am:#c98a12; --aml:#fbefcf; --rd:#b3402a; --rdl:#f6dcd5; --card:#fffdf6; --line:#d8cfb6; --wood:#8a5a2b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
a{color:inherit;text-decoration:none}
.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;background:var(--gd);color:#fff;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:19px;line-height:1.15}
.top p{margin:2px 0 0;font-size:12.5px;opacity:.82}
.top .grow{flex:1;min-width:0}
.ib{width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.15);color:#fff;border:0;display:grid;place-items:center;font-size:24px;flex:none;cursor:pointer}
main{padding:14px 14px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
h2{margin:0 0 10px;font-size:15px;color:var(--gd);text-transform:uppercase;letter-spacing:.04em}
label{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=number],input[type=date]{width:100%;height:50px;border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:20px;background:#fff;color:var(--ink);font-family:inherit}
input:focus{outline:none;border-color:var(--g)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fields .w2{grid-column:1/-1}
.fields input{font-size:17px;height:46px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:14px;border:2px solid var(--g);background:#fff;color:var(--gd);font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;padding:0 14px}
.btn.primary{background:var(--g);color:#fff}
.btn.big{min-height:58px;font-size:18px}
.btn.danger{border-color:var(--rd);color:var(--rd)}
.btn.small{min-height:42px;font-size:14px}
.btn:active{transform:scale(.98)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}

/* Galpones */
.sheds{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}
.shed{position:relative;display:block;aspect-ratio:1/1;--f:#e8dfc6;--s:#b9aa82}
.shed.prog{--f:#fbe7b0;--s:#c98a12}
.shed.done{--f:#cfe6cb;--s:#2f6b3a}
.shed svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.shed .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:37%}
.shed .num{font-size:28px;font-weight:800;line-height:1;color:var(--gd)}
.shed .avg{font-size:11.5px;font-weight:600;color:var(--ink);margin-top:3px}
.shed .dots{position:absolute;left:0;right:0;bottom:8%;display:flex;justify-content:center;gap:3px}
.shed:active{transform:scale(.97)}
.dot{font-style:normal;font-size:9px;font-weight:800;width:15px;height:15px;border-radius:4px;display:grid;place-items:center;border:1.5px solid var(--s);background:#fff;color:var(--mut)}
.dot.mid{background:var(--am);color:#fff;border-color:var(--am)}
.dot.ok{background:var(--g);color:#fff;border-color:var(--g)}

/* Corrales */
.pens{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.pen{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:128px;border:3px solid var(--wood);border-radius:12px;padding:10px;text-align:center;
  background-color:var(--card);
  background-image:linear-gradient(var(--wood),var(--wood)),linear-gradient(var(--wood),var(--wood)),repeating-linear-gradient(90deg,transparent 0 17px,rgba(138,90,43,.26) 17px 20px);
  background-size:100% 6px,100% 6px,100% 100%;background-position:0 8px,0 calc(100% - 8px),0 0;background-repeat:no-repeat}
.pen.mid{background-color:#fff6dc}
.pen.ok{background-color:#e6f2e2}
.pen .l{font-size:34px;font-weight:800;color:var(--gd);line-height:1}
.pen .t{font-size:12px;color:var(--mut);margin-top:6px;font-weight:600}
.pen .p{font-size:17px;font-weight:800;margin-top:2px}
.pen:active{transform:scale(.97)}

.big-card{text-align:center;background:var(--gd);color:#fff;border-color:var(--gd)}
.big-card .lbl{font-size:13px;opacity:.85;text-transform:uppercase;letter-spacing:.05em}
.big-card .val{font-size:40px;font-weight:800;margin:4px 0}
.big-card .sub{font-size:12.5px;opacity:.85}
.warn{margin-top:8px;font-size:13px;background:var(--aml);color:#6b4a00;border-radius:10px;padding:8px 10px;text-align:left}
.cmp{border-radius:14px;padding:12px;margin-bottom:14px;border:2px solid}
.cmp.sobre{background:#e3f0ff;border-color:#2a6fb5}
.cmp.similar{background:var(--gl);border-color:var(--g)}
.cmp.bajo{background:var(--rdl);border-color:var(--rd)}
.cmp .badge{font-weight:800;font-size:17px;margin-bottom:4px}
.cmp div{font-size:14px}
.hintbox{font-size:13.5px;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}

/* Corral: registro */
.hint{min-height:20px;margin:8px 2px 10px;font-size:14px;color:var(--mut);font-weight:600}
.hint.bad{color:var(--rd)}
.bar{height:14px;background:#e9e1c9;border-radius:999px;overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--am);border-radius:999px;transition:width .25s}
.bar.ok i{background:var(--g)}
.progtxt{display:flex;justify-content:space-between;font-size:14px;font-weight:700}
.ent{display:grid;grid-template-columns:44px 1fr 1fr 44px;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.ent:last-child{border-bottom:0}
.ent .n{color:var(--mut);font-weight:700}
.ent .pa{display:block;font-size:12px;color:var(--mut)}
.ent button{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--rd);font-size:18px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:14px 0;font-size:14px}
.sumbar{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:6px;background:var(--gd);color:#fff;padding:12px 14px calc(12px + env(safe-area-inset-bottom));text-align:center;margin-top:8px}
.sumbar small{display:block;font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.04em}
.sumbar b{font-size:19px}

details.card summary{font-weight:700;color:var(--gd);cursor:pointer}
.scroll{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px;text-align:center}
th,td{border:1px solid var(--line);padding:6px 4px}
th{background:#ece4cc;font-size:11.5px}
tr.hl td{background:var(--aml);font-weight:800}

.firma{margin:18px 14px 0;text-align:center;font-size:12.5px;color:var(--mut);font-style:italic;border-top:1px solid var(--line);padding-top:12px}
.firma b{color:var(--gd)}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#222;color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bad{background:var(--rd)}
.mt{margin-top:10px}
</style>
</head>
<body>
<div id="app"></div>
<script src="exceljs.min.js"></script>
<script src="firebase-config.js"></script>
<script src="license.js"></script>
<script src="core.js"></script>
<script src="excel.js"></script>
<script src="app.js"></script>
</body>
</html>
