name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar carpeta www
        run: |
          mkdir -p www
          cp index.html app.js core.js excel.js www/
          cp node_modules/exceljs/dist/exceljs.min.js www/

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Ajustes Android
        run: python3 patch_android.py

      - name: Icono de la app
        continue-on-error: true
        run: |
          pip install pillow
          python3 make_icon.py
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#2f6b3a'

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PesajeAves-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
