name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar carpeta www
        run: |
          mkdir -p www
          cp index.html app.js core.js excel.js license.js www/
          cp node_modules/exceljs/dist/exceljs.min.js www/
          if [ -f firebase-config.js ]; then cp firebase-config.js www/; else
            printf 'window.LICENSE_CONFIG = { PROJECT_ID: "", API_KEY: "" };\n' > www/firebase-config.js; fi
          # admin.html NO se copia: ese panel es solo para el administrador, no para el APK

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Ajustes Android
        run: python3 patch_android.py

      - name: Icono de la app
        continue-on-error: true
        run: |
          pip install pillow
          python3 make_icon.py
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#2f6b3a'

      - name: Sincronizar
        run: npx cap sync android

      - name: Usar firma estable (para que las actualizaciones instalen sin desinstalar)
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
            echo "Firma estable aplicada."
          else
            echo "Aviso: no hay secreto DEBUG_KEYSTORE_BASE64 configurado. Se usará una firma" \
                 "temporal distinta en cada compilación, y las actualizaciones necesitarán" \
                 "desinstalar la app vieja antes de instalar la nueva."
          fi

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: PesajeAves-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
